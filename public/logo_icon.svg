<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#144A35" />
      <stop offset="55%" stop-color="#0D2B1F" />
      <stop offset="100%" stop-color="#071710" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#E5A93B" />
      <stop offset="100%" stop-color="#B87D18" />
    </linearGradient>
    <linearGradient id="peakGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#228B5D" />
      <stop offset="100%" stop-color="#0E3B28" />
    </linearGradient>
    <linearGradient id="brocadeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C84B31" />
      <stop offset="50%" stop-color="#E5A93B" />
      <stop offset="100%" stop-color="#C84B31" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="20" y="20" width="472" height="472" rx="110" fill="url(#bgGrad)" />
  <rect x="24" y="24" width="464" height="464" rx="106" fill="none" stroke="url(#goldGrad)" stroke-width="10" opacity="0.92" />

  <!-- Highland Sun & Brocade Halo -->
  <circle cx="256" cy="185" r="92" fill="none" stroke="url(#goldGrad)" stroke-width="8" opacity="0.75" />
  <circle cx="256" cy="185" r="68" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.6" stroke-dasharray="10 6" />
  <circle cx="256" cy="185" r="42" fill="url(#goldGrad)" opacity="0.28" />

  <!-- Hoang Lien Son & Fansipan 3143m Peaks -->
  <polygon points="86,335 186,188 278,335" fill="#175E42" opacity="0.9" />
  <polygon points="168,335 288,136 426,335" fill="url(#peakGrad)" stroke="url(#goldGrad)" stroke-width="5" stroke-linejoin="round" />

  <!-- Fansipan Summit Spire / Flagpole -->
  <polygon points="288,104 298,136 278,136" fill="url(#goldGrad)" />
  <line x1="288" y1="136" x2="268" y2="335" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" opacity="0.85" />

  <!-- Terraced Rice Waves & Mist Ribbons -->
  <path d="M 88 335 Q 180 308, 256 332 T 424 328" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" />
  <path d="M 106 356 Q 195 332, 266 354 T 406 350" fill="none" stroke="url(#brocadeGrad)" stroke-width="7" stroke-linecap="round" />

  <!-- Monogram LC in Gold -->
  <text x="256" y="446" text-anchor="middle" font-family="'Outfit', 'Be Vietnam Pro', 'Segoe UI', sans-serif" font-weight="900" font-size="84" fill="url(#goldGrad)" filter="url(#glow)" letter-spacing="5">LC</text>
</svg>
